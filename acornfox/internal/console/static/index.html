<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AcornFox 控制台</title>
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="AcornFox 首页">
    <svg viewBox="0 0 120 60" aria-hidden="true"><path class="logo-track" fill-rule="evenodd" d="M30 0 H90 A30 30 0 0 1 90 60 H30 A30 30 0 0 1 30 0 Z M68 30 A22 22 0 1 0 112 30 A22 22 0 1 0 68 30 Z M16 30 A3.5 3.5 0 1 0 23 30 A3.5 3.5 0 1 0 16 30 Z M30.3 30 A5 5 0 1 0 40.3 30 A5 5 0 1 0 30.3 30 Z M47.7 30 A6.5 6.5 0 1 0 60.7 30 A6.5 6.5 0 1 0 47.7 30 Z"/><circle class="logo-knob" cx="90" cy="30" r="22"/></svg>
    <span>AcornFox</span>
  </a>
  <span class="server-chip" id="server-chip" title="当前服务器"><span class="dot" id="server-dot"></span><span id="server-label">正在连接…</span></span>
  <nav class="nav" id="nav" aria-label="主导航"></nav>
  <div class="top-actions">
    <button class="iconbtn bell" type="button" id="bell" aria-label="需要处理" aria-haspopup="dialog" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.75a5 5 0 0 0-5 5v2.6c0 .7-.24 1.38-.68 1.93L3.4 13.4a.75.75 0 0 0 .58 1.22h12.04a.75.75 0 0 0 .58-1.22l-.92-1.12a3.05 3.05 0 0 1-.68-1.93v-2.6a5 5 0 0 0-5-5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 16.6a2.1 2.1 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="bell-count" id="bell-count" hidden></span>
    </button>
    <button class="btn" type="button" id="ask-ai">让 AI 帮忙</button>
    <button class="iconbtn" type="button" id="theme" aria-label="切换深浅色">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5 A6.5 6.5 0 0 1 10 16.5 Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main id="page" class="page" aria-live="off"></main>

<nav class="tabbar" id="tabbar" aria-label="主导航（手机）"></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="notify" id="notify" role="dialog" aria-label="需要处理" hidden></div>
<div class="notify-pop" id="notify-pop" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="confirm-overlay" hidden></div>
<div class="dialog" id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <h3 id="confirm-title"></h3>
  <p id="confirm-body"></p>
  <label class="check" id="confirm-extra" hidden><input type="checkbox" id="confirm-check" /><span id="confirm-check-label"></span></label>
  <div class="actions">
    <button class="btn" type="button" id="confirm-cancel">取消</button>
    <button class="btn primary" type="button" id="confirm-ok"></button>
  </div>
</div>

<div class="overlay" id="sheet-overlay" hidden></div>
<div class="dialog" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

<script src="app.js" type="module"></script>
</body>
</html>
