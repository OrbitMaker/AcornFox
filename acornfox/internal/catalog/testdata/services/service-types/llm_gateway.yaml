schema: 1
kind: llm_gateway
label: 大模型接口
summary: 兼容 OpenAI 接口的大模型服务，给要调用大模型的应用用
fields:
  - { key: base_url, label: 接口地址, type: url, required: true }
  - { key: api_key, label: API Key, type: string, required: true, secret: true }
  - { key: model, label: 默认模型, type: string }
test:
  http: { url: "{{base_url}}/models", bearer: "{{api_key}}", expect_status: [200] }
