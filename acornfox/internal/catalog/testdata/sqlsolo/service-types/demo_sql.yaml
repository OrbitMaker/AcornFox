schema: 1
kind: demo_sql
label: 样例数据库
summary: 只为测试用的一种数据库服务：地址、端口、库名、账号、密码
fields:
  - { key: host, label: 地址, type: string, required: true }
  - { key: port, label: 端口, type: int, default: 5000 }
  - { key: database, label: 库名, type: string, required: true }
  - { key: username, label: 账号, type: string, required: true }
  - { key: password, label: 密码, type: string, required: true, secret: true }
  - { key: url, label: 连接串, type: string, secret: true }
test:
  tcp: { host: "{{host}}", port: "{{port}}" }
