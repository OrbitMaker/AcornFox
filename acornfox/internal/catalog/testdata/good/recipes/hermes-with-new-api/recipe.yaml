id: hermes-with-new-api
schema: 1
title: Hermes 智能体 + New API
summary: 装好智能体和模型网关并连起来，只要在网关里加一次上游 Key
keywords: [hermes, 爱马仕, newapi, 智能体]
apps:
  - app: new-api
  - app: hermes-agent
links:
  - { from: new-api, to: hermes-agent, uses: llm }
delivery:
  tier: steps
  minutes: 4
  memory_mb: 2560
  user_steps:
    - 确认给 Hermes 填的模型上下文不少于 64K，否则 Hermes 启动不了
    - 在 New API 里新建一个渠道，填上游的 Key 和这个模型
    - 打开 Hermes 的页面，用 AcornFox 控制台应用详情里的密码登录
