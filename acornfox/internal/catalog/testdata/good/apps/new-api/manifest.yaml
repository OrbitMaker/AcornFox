# New API, written in manifest format 3. A draft: not published yet. The
# platform has no code of its own for this app: the steps below (init, and
# provides' issue, revoke and check) are all it does in New API. The real-app
# test in internal/appinstall runs these very steps against the image named
# below.
#
# New API v1.0.0-rc.48, as measured:
#   - POST /api/user/login answers data.access_token (a 15-minute token) and
#     data.user.id. Management calls need "Authorization: Bearer <token>" and
#     "New-Api-User: <id>"; the login cookie alone is refused (401).
#   - POST /api/token/ answers without the new token's id. Names are at most
#     50 characters ("Token name is too long").
#   - GET /api/token/search?keyword=<name> finds a token by its exact name;
#     GET /api/token/{id} shows one with its value masked; POST
#     /api/token/{id}/key gives the value without "sk-" (clients may send it
#     with or without).
#   - Asking for (GET /api/token/{id}) or deleting a token that is not there
#     answers HTTP 200 with success false, message "record not found".
id: new-api
schema: 3
source: upstream
maintainer: acornfox

app:
  name: New API
  summary: 把多家大模型合成一个 OpenAI 兼容的接口，统一管理 Key、令牌和额度
  category: ai-gateway
  tags: [ai, llm, gateway]
  icon: icon.svg
  homepage: https://github.com/QuantumNous/new-api
  license: AGPL-3.0-only
  source_code: https://github.com/QuantumNous/new-api

lifecycle:
  min_platform: "0.6.0"
  status: active

resources:
  memory_mb: { min: 256, recommended: 512 }
  cpu: { min: 0.5 }
  disk_mb: { min: 512 }
  platforms: [linux/amd64, linux/arm64]
  gpu: none

release:
  version: v1.0.0-rc.48
  images:
    - name: app
      repository: calciumion/new-api
      tag: v1.0.0-rc.48
      digest: sha256:51401a46510bf110ffafdf2cd7177e0b80bbcf02439e69b665c696f330e87ae5
      size_mb: 78

endpoints:
  - name: web
    port: 3000
    protocol: http
    primary: true
    health:
      path: /api/status
      expect_json: { success: true }
      timeout_s: 60

exposure:
  default: local

volumes:
  - name: data
    path: /data
    backup: true

params:
  - key: admin_username
    type: string
    default: admin
    pattern: "^[A-Za-z0-9_]{1,12}$"
    label: 管理员用户名
    editable: never
  - key: admin_password
    type: secret
    generate: { length: 20 }
    label: 管理员密码
    hint: 留空就自动生成，装好后在应用详情里查看
    editable: never
  - key: session_secret
    type: secret
    generate: { length: 64, charset: hex }
    hidden: true
    editable: never

env:
  - { key: SESSION_SECRET, from: params.session_secret, secret: true }
  - { key: SQLITE_PATH, value: /data/one-api.db }
  - { key: TZ, from: platform.tz }

# The setup wizard's API is open to anyone until it has been run once: set it
# up right after the health check. Then turn off self-service sign-up, which
# upstream leaves on (anyone who reaches the page could make an account).
init:
  - name: setup-admin
    when: after_healthy
    http:
      method: POST
      path: /api/setup
      json:
        username: "{{params.admin_username}}"
        password: "{{params.admin_password}}"
        confirmPassword: "{{params.admin_password}}"
        SelfUseModeEnabled: true
        DemoSiteEnabled: false
      expect_json: { success: true }
  - name: login
    when: after_healthy
    http:
      method: POST
      path: /api/user/login
      json: { username: "{{params.admin_username}}", password: "{{params.admin_password}}" }
      expect_json: { success: true }
      save:
        access_token: { path: data.access_token, secret: true }
        user_id: data.user.id
  - name: close-sign-up
    when: after_healthy
    http:
      method: PUT
      path: /api/option/
      headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
      json: { key: RegisterEnabled, value: false }
      expect_json: { success: true }

first_login:
  - { label: 账号, from: params.admin_username }
  - { label: 密码, from: params.admin_password, secret: true }

# Other apps on this machine can use it as their model API: each one gets a
# token of its own, named after it and this issue's number.
provides:
  - kind: llm_gateway
    endpoint: web
    values:
      base_url: "{{self.internal_url}}/v1"
      api_key: { issued: api_key, secret: true }
      model: { ask: 可以不填；要填的话，先在 New API 里加好一个能调通的渠道，再填这个渠道里的一个模型名 }
    issue:
      - name: login
        http:
          method: POST
          path: /api/user/login
          json: { username: "{{params.admin_username}}", password: "{{params.admin_password}}" }
          expect_json: { success: true }
          save:
            access_token: { path: data.access_token, secret: true }
            user_id: data.user.id
      - name: create
        http:
          method: POST
          path: /api/token/
          headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
          json: { name: "acornfox-{{consumer.name}}-{{issue.id}}", remain_quota: 0, unlimited_quota: true, expired_time: -1 }
          expect_json: { success: true }
      # The create answer has no id: find the token by its name, which no
      # other token has. Asked again a moment later if it is not listed yet.
      - name: find
        http:
          method: GET
          path: /api/token/search?keyword=acornfox-{{consumer.name}}-{{issue.id}}
          headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
          expect_json: { success: true }
          retry: { times: 3, delay_s: 1 }
          save:
            token_id:
              list: data.items
              where: { name: "acornfox-{{consumer.name}}-{{issue.id}}" }
              field: id
      - name: key
        http:
          method: POST
          path: /api/token/{{saved.token_id}}/key
          headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
          expect_json: { success: true }
          save:
            api_key: { path: data.key, prefix: "sk-", secret: true }
    # Deleted only while the number is still this issue's token: a New API set
    # up anew numbers tokens from 1 again. A token that is not there any more
    # (removed by hand, or by an earlier revoke) counts as taken back.
    revoke:
      - name: login
        http:
          method: POST
          path: /api/user/login
          json: { username: "{{params.admin_username}}", password: "{{params.admin_password}}" }
          expect_json: { success: true }
          save:
            access_token: { path: data.access_token, secret: true }
            user_id: data.user.id
      - name: same-token
        http:
          method: GET
          path: /api/token/{{issued.token_id}}
          headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
          finish_if: { json: { success: false, message: record not found } }
          expect_json: { success: true, data: { id: "{{issued.token_id}}", name: "acornfox-{{consumer.name}}-{{issued.issue_id}}" } }
      - name: delete
        http:
          method: DELETE
          path: /api/token/{{issued.token_id}}
          headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
          finish_if: { json: { success: false, message: record not found } }
          expect_json: { success: true }
    # Still the token handed out, whether the user has turned it off or not
    # (turning it on again is the user's call).
    check:
      - name: login
        http:
          method: POST
          path: /api/user/login
          json: { username: "{{params.admin_username}}", password: "{{params.admin_password}}" }
          expect_json: { success: true }
          save:
            access_token: { path: data.access_token, secret: true }
            user_id: data.user.id
      - name: same-token
        http:
          method: GET
          path: /api/token/{{issued.token_id}}
          headers: { Authorization: "Bearer {{saved.access_token}}", New-Api-User: "{{saved.user_id}}" }
          expect_json: { success: true, data: { id: "{{issued.token_id}}", name: "acornfox-{{consumer.name}}-{{issued.issue_id}}" } }

delivery:
  tier: auto
  minutes: 1
  user_steps:
    - 登录后在“渠道”里新建一个渠道，填上游的 Key 和模型，点“测试”

upgrade:
  from: ">=v1.0.0-rc.40"
  breaking: false

uninstall:
  data: [volumes.data]
