# Hermes Agent, written in manifest format 3. A draft: not published yet. It
# needs a model API like any other service (uses, kind llm_gateway): whatever
# is registered on the machine, or provided by an app installed with it in a
# recipe, is connected. Which model it talks to is its own setting (model),
# filled in by the user: the service's model is at most a default, and may
# be empty.
id: hermes-agent
schema: 3
source: upstream
maintainer: acornfox

app:
  name: Hermes 智能体
  summary: 常驻的 AI 智能体，可以接飞书、钉钉、企业微信、微信等做机器人
  category: ai-agent
  tags: [ai, agent]
  keywords: [hermes, hermes agent, 爱马仕, 爱马仕智能体]
  icon: icon.svg
  homepage: https://github.com/NousResearch/hermes-agent
  license: MIT

lifecycle:
  min_platform: "0.6.0"
  status: active

resources:
  memory_mb: { min: 1024, recommended: 2048 }
  cpu: { min: 1 }
  disk_mb: { min: 6144 }
  platforms: [linux/amd64, linux/arm64]
  gpu: none

release:
  version: v0.23.0
  images:
    - name: app
      repository: nousresearch/hermes-agent
      tag: v0.23.0
      digest: sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
      size_mb: 1150
      artifact: hermes-agent-v0.23.0-image
      artifact_sha256: d356bba314af272039743d82123bf57a38e67696d69558a6871c4b999700df45
      artifact_size: 1120227840

container:
  command: [gateway, run]
  pids_limit: 512
  no_new_privileges: true

endpoints:
  - name: web
    port: 9119
    protocol: http
    primary: true
    health:
      path: /api/status
      timeout_s: 300

exposure:
  default: local

volumes:
  - name: data
    path: /opt/data
    backup: true

params:
  - key: dashboard_password
    type: secret
    generate: { length: 24 }
    hidden: true
    editable: never
  - key: dashboard_session_secret
    type: secret
    generate: { length: 64, charset: hex }
    hidden: true
    editable: never
  - key: model
    type: string
    label: 模型名
    hint: 要调用的模型，上下文要不少于 64K，例如 qwen-plus
    required: true

# Required: the config file below takes its address and key from it, and a
# config file has no way yet to say what to write when an optional service
# is missing.
uses:
  - { name: llm, kind: llm_gateway }

env:
  - { key: HERMES_DASHBOARD, value: "1" }
  - { key: TZ, from: platform.tz }
  - { key: PIP_INDEX_URL, from: platform.mirror.pypi }
  - { key: UV_DEFAULT_INDEX, from: platform.mirror.pypi }
  - { key: npm_config_registry, from: platform.mirror.npm }
  - { key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME, value: admin }
  - { key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD, from: params.dashboard_password, secret: true }
  - { key: HERMES_DASHBOARD_BASIC_AUTH_SECRET, from: params.dashboard_session_secret, secret: true }

files:
  - volume: data
    path: config.yaml
    overwrite: install
    mode: "0600"
    owner: "10000:10000"
    template: |
      model:
        provider: custom
        base_url: "{{uses.llm.base_url}}"
        api_key: "{{uses.llm.api_key}}"
        default: "{{params.model}}"
      approvals:
        mode: manual
      terminal:
        backend: local

first_login:
  - { label: 账号, value: admin }
  - { label: 密码, from: params.dashboard_password, secret: true }

delivery:
  tier: steps
  minutes: 3
  user_steps:
    - 确认所用模型的上下文不少于 64K，否则 Hermes 启动不了
    - 打开 Hermes 的页面，用 AcornFox 控制台应用详情里的密码登录
    - 要接飞书、企业微信等机器人时，在 Hermes 的页面里填机器人凭据

upgrade:
  from: ">=v0.16.0"
  breaking: false

uninstall:
  data: [volumes.data]
